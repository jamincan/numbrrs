app = 'numbrrs'
primary_region = 'yyz'
# How long Fly waits after its stop signal before killing the machine. The
# default of 5s is shorter than a page load can legitimately take (a roster
# fetch may block for 8s), so a deploy would cut those requests off. This has to
# stay above SHUTDOWN_TIMEOUT below, or the server is killed mid-drain anyway.
kill_timeout = '15s'

[build]

[env]
  PORT = '3000'
  # Seconds the server gives in-flight requests to finish once told to stop,
  # before it closes their connections itself (adapter-node; its default of 30
  # would outlast kill_timeout).
  SHUTDOWN_TIMEOUT = '10'
  # The SQLite file on the volume mounted below. While a Fly secret of the same
  # name exists, the secret is what the machine sees, not this.
  DATABASE_URL = '/data/numbrrs.db'
  # Fly terminates TLS at its proxy, so the app itself is spoken to over plain
  # http. Without this the adapter guesses the scheme, and the guess is what
  # SvelteKit compares the Origin header against when a form is posted — the
  # /admin login. Fly's proxy sets this header and overwrites any the client sent.
  PROTOCOL_HEADER = 'x-forwarded-proto'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine always up removes the cold-start failure mode entirely — the
  # first Reddit-referred visitor no longer pays a container boot plus a
  # possible 8s upstream roster fetch while everyone behind them queues.
  # ~$1.94/mo instead of ~$0.55/mo scale-to-zero (docs/hosting.md).
  min_machines_running = 1

  # Without this, Fly's defaults let many concurrent requests pile onto one
  # 256MB box until it OOMs rather than shedding load — degraded-but-up beats
  # down. Sized for a shared-cpu-1x/256MB machine serving lightweight SSR;
  # revisit alongside any [[vm]] change. See docs/hosting.md's "Where it
  # breaks" section.
  [http_service.concurrency]
    type = 'connections'
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'data'
  destination = '/data'
