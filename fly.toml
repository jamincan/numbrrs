app = 'numbrrs'
primary_region = 'yyz'

[build]

[env]
  PORT = '3000'
  # Fly terminates TLS at its proxy, so the app itself is spoken to over plain
  # http. Without this the adapter guesses the scheme, and the guess is what
  # SvelteKit compares the Origin header against when a form is posted — the
  # /admin login. Fly's proxy sets this header and overwrites any the client sent.
  PROTOCOL_HEADER = 'x-forwarded-proto'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'data'
  destination = '/data'
