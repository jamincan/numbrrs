name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run check

      - run: pnpm run test

      - run: pnpm run build

      # Informational rather than blocking: pnpm's dependency graph doesn't
      # distinguish "a build-time tool nested under a runtime dependency" from
      # "code that actually executes in production", so failing here would
      # gate merges on advisories in vite/esbuild's own dev server — packages
      # that never run on Fly. Visibility is the point; a human still has to
      # read this and decide whether a given advisory is worth acting on.
      - run: pnpm audit --audit-level=high
        continue-on-error: true

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run test:e2e
