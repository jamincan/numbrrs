<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The site has one theme. Saying so makes the browser's own pieces
		     (scrollbars, form controls, the canvas before the stylesheet arrives)
		     dark too. -->
		<meta name="color-scheme" content="dark" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
