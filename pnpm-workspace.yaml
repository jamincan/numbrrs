# pnpm 10 moved settings out of package.json's `pnpm` field and into this file,
# and pnpm 11 renamed the install-script allowlist from `onlyBuiltDependencies`
# (a list) to `allowBuilds` (an explicit true/false per package).
#
# Only these packages may run install scripts. better-sqlite3 must compile its
# native binding or the server cannot open the database at all; esbuild sets up
# its platform binary, which drizzle-kit and wrangler bundle with (Vite 8 builds
# with Rolldown and no longer needs it, so this is a dev-tool concern only).
# Everything else stays unbuilt, so a compromised transitive dependency has no
# install-time foothold. Setting one of these to true is a decision to execute
# that package's code at install.
#
# workerd is wrangler's local runtime, wanted only by `wrangler dev`. The Worker
# is deployed with `wrangler deploy`, which bundles and uploads without it, so it
# stays false — see cloudflare/locale-cache-worker.ts.
# package.json asks for Node 26, the version production and CI run. With this on,
# an install under an older Node stops instead of warning: a native module built
# for the wrong Node fails only when the server first opens the database.
engineStrict: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: false

# drizzle-kit 0.31 (latest stable) loads TypeScript through @esbuild-kit, which
# pins esbuild 0.18 and carries its dev-server advisory (GHSA-67mh-4wv8-2f99).
# drizzle-kit never starts that server, but the advisory sits in every audit, so
# the loader gets the esbuild drizzle-kit already uses itself. Checked with
# `drizzle-kit check` and `drizzle-kit generate`. Drop this once drizzle-kit 1.0,
# which no longer depends on @esbuild-kit, is stable.
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
